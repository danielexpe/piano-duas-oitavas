[package]
name = "piano-duas-oitavas"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Piano de duas oitavas em TUI/fbdev com mapeamento do teclado alfanumérico, síntese polifônica e efeitos visuais."
license = "MIT"
publish = false

[[bin]]
name = "piano-duas-oitavas"
path = "src/main.rs"

[features]
default = ["audio"]
audio = ["dep:libloading"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
tiny-skia = "0.11"
fontdue = "0.9"
libc = "0.2"
thiserror = "2"
libloading = { version = "0.8", optional = true }

[workspace]
members = [".", "xtask"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = "thin"
